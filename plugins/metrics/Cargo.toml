[package]
name = "wangcap-bridge-plugin-metrics"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Reference external metrics plugin for wangcap-bridge"

[dependencies]
anyhow = { workspace = true }
bon = { workspace = true }
portable-atomic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wangcap-bridge = { path = "../..", default-features = false, features = ["plugins"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wangcap-bridge = { path = "../..", default-features = false, features = [
    "plugins",
    "tokio-runtime",
] }

[lints]
workspace = true
